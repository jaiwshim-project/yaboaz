<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YABOAZ 관리자 인증</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#092033;font-family:Arial,"Noto Sans KR",sans-serif;color:#fff}.card{width:min(420px,calc(100% - 40px));padding:36px;border-radius:24px;background:#fff;color:#172636;box-shadow:0 24px 80px #0006}.kicker{font-size:11px;color:#0f8b8d;font-weight:900;letter-spacing:.16em}.card h1{margin:12px 0}.card p{line-height:1.6;color:#718092}.card input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d6e1e8;border-radius:10px;font-size:18px;letter-spacing:.18em}.card button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:#0f8b8d;color:#fff;font-weight:800;font-size:15px}.message{min-height:24px;color:#c0392b;margin-top:12px}</style>
</head>
<body><main class="card"><div class="kicker">YABOAZ ADMIN AREA</div><h1>관리자 인증</h1><p>관리자 비밀키로 인증하면 회원가입 없이 유료 콘텐츠와 운영 화면에 접근할 수 있습니다.</p><form><input type="password" autocomplete="off" required aria-label="관리자 비밀키"><button>관리자 세션 시작</button><div class="message" role="status"></div></form></main>
<script>
document.querySelector('form').addEventListener('submit',async function(event){event.preventDefault();var message=document.querySelector('.message');var response=await fetch('/api/admin-login.js',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.querySelector('input').value})});var data=await response.json();if(!data.ok){message.textContent=data.message||'인증에 실패했습니다.';return;}location.href='/13step-Roadmap.html';});
</script>
<script defer src="/assets/common-branding.js"></script></body></html>
