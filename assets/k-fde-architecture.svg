<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">K-FDE 현장 실행·운영 플랫폼 13단계 구조도</title>
  <desc id="desc">FDE 발견 5단계와 AX 설계·구축 8단계, 증거·질문·온톨로지·AI·워크플로·성과 레이어의 연결 구조</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7fbf8"/><stop offset="1" stop-color="#edf5f0"/></linearGradient><linearGradient id="phase1"><stop stop-color="#fff1e8"/><stop offset="1" stop-color="#ffe2d0"/></linearGradient><linearGradient id="phase2"><stop stop-color="#e8f6f1"/><stop offset="1" stop-color="#ccefe0"/></linearGradient><linearGradient id="phase3"><stop stop-color="#edf1ff"/><stop offset="1" stop-color="#dce4ff"/></linearGradient><linearGradient id="phase4"><stop stop-color="#fff7df"/><stop offset="1" stop-color="#ffedb8"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17372b" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16825f"/></marker><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#17221f} .title{font-size:34px;font-weight:800;fill:#102721}.subtitle{font-size:16px;fill:#52615b}.phase{font-size:18px;font-weight:800}.num{font-size:17px;font-weight:800}.step{font-size:16px;font-weight:750}.detail{font-size:12px;fill:#52615b}.layer{font-size:16px;font-weight:800;fill:#fff}.layertext{font-size:13px;fill:#d8ebe3}</style></defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="70" y="70" class="title">K-FDE 현장 실행·운영 플랫폼 구조도</text><text x="70" y="102" class="subtitle">현장의 증거를 실행 가능한 온톨로지와 AX 플랫폼 자산으로 전환하는 13단계 운영 구조</text>
  <rect x="70" y="135" width="330" height="55" rx="12" fill="url(#phase1)" stroke="#e98a59"/><text x="95" y="169" class="phase" fill="#9a3412">PHASE 1 · FDE 발견 5단계</text>
  <rect x="420" y="135" width="370" height="55" rx="12" fill="url(#phase2)" stroke="#49b88d"/><text x="445" y="169" class="phase" fill="#065f46">PHASE 2 · 현장의 이해</text>
  <rect x="810" y="135" width="370" height="55" rx="12" fill="url(#phase3)" stroke="#7187df"/><text x="835" y="169" class="phase" fill="#1e40af">PHASE 3 · AX 실행 아키텍처 설계</text>
  <rect x="1200" y="135" width="330" height="55" rx="12" fill="url(#phase4)" stroke="#d9a936"/><text x="1225" y="169" class="phase" fill="#925d06">PHASE 4 · 구현·현장 검증</text>
  <g filter="url(#shadow)">
    <g><rect x="70" y="220" width="150" height="105" rx="14" fill="url(#phase1)" stroke="#e98a59"/><text x="90" y="250" class="num">01</text><text x="90" y="276" class="step">고객 온보딩</text><text x="90" y="299" class="detail">범위·권한·성공기준</text></g>
    <g><rect x="235" y="220" width="150" height="105" rx="14" fill="url(#phase1)" stroke="#e98a59"/><text x="255" y="250" class="num">02</text><text x="255" y="276" class="step">초기자료 정규화</text><text x="255" y="299" class="detail">증거·출처·신뢰도</text></g>
    <g><rect x="400" y="220" width="150" height="105" rx="14" fill="url(#phase1)" stroke="#e98a59"/><text x="420" y="250" class="num">03</text><text x="420" y="276" class="step">2A4 문제해결</text><text x="420" y="299" class="detail">목표·원인·실행</text></g>
    <g><rect x="565" y="220" width="150" height="105" rx="14" fill="url(#phase1)" stroke="#e98a59"/><text x="585" y="250" class="num">04</text><text x="585" y="276" class="step">현장 탐색</text><text x="585" y="299" class="detail">사람·업무·병목</text></g>
    <g><rect x="730" y="220" width="150" height="105" rx="14" fill="url(#phase1)" stroke="#e98a59"/><text x="750" y="250" class="num">05</text><text x="750" y="276" class="step">맞춤 인터뷰</text><text x="750" y="299" class="detail">질문·증거·런시트</text></g>
    <g><rect x="895" y="220" width="150" height="105" rx="14" fill="url(#phase2)" stroke="#49b88d"/><text x="915" y="250" class="num">06</text><text x="915" y="276" class="step">온톨로지 7요소</text><text x="915" y="299" class="detail">객체·관계·행동</text></g>
    <g><rect x="1060" y="220" width="150" height="105" rx="14" fill="url(#phase3)" stroke="#7187df"/><text x="1080" y="250" class="num">07</text><text x="1080" y="276" class="step">AI 판단</text><text x="1080" y="299" class="detail">근거·예외·승인</text></g>
    <g><rect x="1225" y="220" width="150" height="105" rx="14" fill="url(#phase3)" stroke="#7187df"/><text x="1245" y="250" class="num">08</text><text x="1245" y="276" class="step">AI Agent</text><text x="1245" y="299" class="detail">역할·도구·권한</text></g>
    <g><rect x="1390" y="220" width="150" height="105" rx="14" fill="url(#phase3)" stroke="#7187df"/><text x="1410" y="250" class="num">09</text><text x="1410" y="276" class="step">워크플로</text><text x="1410" y="299" class="detail">상태·조건·예외</text></g>
    <g><rect x="645" y="370" width="150" height="105" rx="14" fill="url(#phase3)" stroke="#7187df"/><text x="665" y="400" class="num">10</text><text x="665" y="426" class="step">화면·데이터</text><text x="665" y="449" class="detail">행동·필드·흐름</text></g>
    <g><rect x="810" y="370" width="150" height="105" rx="14" fill="url(#phase4)" stroke="#d9a936"/><text x="830" y="400" class="num">11</text><text x="830" y="426" class="step">MVP 개발</text><text x="830" y="449" class="detail">작은 실행 단위</text></g>
    <g><rect x="975" y="370" width="150" height="105" rx="14" fill="url(#phase4)" stroke="#d9a936"/><text x="995" y="400" class="num">12</text><text x="995" y="426" class="step">Bootcamp 검증</text><text x="995" y="449" class="detail">현장·성과·피드백</text></g>
    <g><rect x="1140" y="370" width="150" height="105" rx="14" fill="url(#phase4)" stroke="#d9a936"/><text x="1160" y="400" class="num">13</text><text x="1160" y="426" class="step">플랫폼 자산화</text><text x="1160" y="449" class="detail">재사용·확장·표준</text></g>
  </g>
  <g stroke="#16825f" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M220 272h15"/><path d="M385 272h15"/><path d="M550 272h15"/><path d="M715 272h15"/><path d="M880 272h15"/><path d="M1045 272h15"/><path d="M1210 272h15"/><path d="M1375 272h15"/><path d="M1465 325v45H720"/><path d="M795 422h15"/><path d="M960 422h15"/><path d="M1125 422h15"/></g>
  <rect x="70" y="545" width="1460" height="95" rx="16" fill="#17382d"/><text x="100" y="578" class="layer">증거 레이어</text><text x="100" y="608" class="layertext">현장 기록 · 인터뷰 · 문서 · 로그 · 출처 · 신뢰도</text><text x="430" y="578" class="layer">질문·지식 레이어</text><text x="430" y="608" class="layertext">질문 의도 · 기대 결과 · 객체 · 관계 · 상태 · 규칙</text><text x="820" y="578" class="layer">실행 레이어</text><text x="820" y="608" class="layertext">AI 판단 · Agent · 승인 · 워크플로 · 액션</text><text x="1190" y="578" class="layer">성과 레이어</text><text x="1190" y="608" class="layertext">KPI · 검증 · 회고 · 재사용 자산</text>
  <g stroke="#7cc9a9" stroke-width="2" stroke-dasharray="7 8" fill="none"><path d="M145 325v220"/><path d="M475 325v220"/><path d="M970 475v70"/><path d="M1215 475v70"/></g>
  <rect x="70" y="700" width="1460" height="190" rx="16" fill="#ffffff" stroke="#dbe3df"/><text x="100" y="740" class="phase" fill="#102721">운영 원칙</text><g class="detail"><text x="100" y="780">01  모든 판단은 증거와 출처에서 시작</text><text x="100" y="815">02  온톨로지는 객체·관계·상태·이벤트·규칙·행동으로 검증</text><text x="100" y="850">03  고위험 행동은 Human-in-the-loop 승인 후 실행</text><text x="820" y="780">04  각 단계 산출물은 다음 단계의 입력으로 재사용</text><text x="820" y="815">05  MVP와 Bootcamp에서 현장 성과를 먼저 확인</text><text x="820" y="850">06  검증된 질문·워크플로·KPI를 플랫폼 자산으로 확장</text></g>
</svg>
